server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Habilitar compresión Gzip (Rendimiento de producción)
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 2. Manejo de rutas para Single Page Applications (React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Proxy reverso para API (Garantiza funcionamiento en Docker Compose local)
    #location /api/ {
    #    proxy_pass http://back:8080/api/;
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #    proxy_set_header X-Forwarded-Proto $scheme;
    #}

    # 4. Caché de alto rendimiento para recursos estáticos de Vite (JS, CSS, SVG)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # 5. Seguridad: Bloquear acceso a archivos ocultos (.git, .env)
    location ~ /\. {
        deny all;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}