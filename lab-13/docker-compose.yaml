services:
  db:
    image: mariadb:11
    container_name: keytest_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: key_test_db
      MARIADB_USER: userapp
      MARIADB_PASSWORD: userpass
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
      - ./database/insert.sql:/docker-entrypoint-initdb.d/2-insert.sql:ro
    ports:
      - "3306:3306"
    networks:
      - keytest_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  monolith:
    build:
      context: ./keytest
      dockerfile: ../docker/Dockerfile
    container_name: keytest_web
    restart: unless-stopped
    environment:
      APP_HOST: localhost
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: key_test_db
      DB_USER: userapp
      DB_PASSWORD: userpass
    volumes:
      - ./keytest:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keytest_network

volumes:
  mariadb_data:

networks:
  keytest_network:
    driver: bridge
