{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de teclado latinoamericano</title>
    <link rel="stylesheet" href="{% static 'app/css/keyboard.css' %}">
</head>
<body>
    <main class="keyboard-validator">
        <header class="page-header">
            <p class="eyebrow">Herramienta de diagnóstico</p>
            <h1>Validador de teclado</h1>
            <p class="subtitle">Pulsa las teclas de tu teclado español latinoamericano para comprobar su lectura.</p>
        </header>

        <section class="keyboard-panel" aria-label="Teclado español latinoamericano">
            <div class="keyboard" id="keyboard">
                <div class="keyboard-row">
                    <button class="key key-wide" data-code="Escape">Esc</button>
                    <button class="key key-wide" data-code="F1">F1</button>
                    <button class="key key-wide" data-code="F2">F2</button>
                    <button class="key key-wide" data-code="F3">F3</button>
                    <button class="key key-wide" data-code="F4">F4</button>
                    <button class="key key-wide" data-code="F5">F5</button>
                    <button class="key key-wide" data-code="F6">F6</button>
                    <button class="key key-wide" data-code="F7">F7</button>
                    <button class="key key-wide" data-code="F8">F8</button>
                    <button class="key key-wide" data-code="F9">F9</button>
                    <button class="key key-wide" data-code="F10">F10</button>
                    <button class="key key-wide" data-code="F11">F11</button>
                    <button class="key key-wide" data-code="F12">F12</button>
                </div>
                <div class="keyboard-row">
                    <button class="key" data-code="Backquote">°</button><button class="key" data-code="Digit1">1</button><button class="key" data-code="Digit2">2</button><button class="key" data-code="Digit3">3</button><button class="key" data-code="Digit4">4</button><button class="key" data-code="Digit5">5</button><button class="key" data-code="Digit6">6</button><button class="key" data-code="Digit7">7</button><button class="key" data-code="Digit8">8</button><button class="key" data-code="Digit9">9</button><button class="key" data-code="Digit0">0</button><button class="key" data-code="Minus">'</button><button class="key" data-code="Equal">¿</button><button class="key key-enter" data-code="Backspace">Retroceso</button>
                </div>
                <div class="keyboard-row">
                    <button class="key key-tab" data-code="Tab">Tab</button><button class="key" data-code="KeyQ">Q</button><button class="key" data-code="KeyW">W</button><button class="key" data-code="KeyE">E</button><button class="key" data-code="KeyR">R</button><button class="key" data-code="KeyT">T</button><button class="key" data-code="KeyY">Y</button><button class="key" data-code="KeyU">U</button><button class="key" data-code="KeyI">I</button><button class="key" data-code="KeyO">O</button><button class="key" data-code="KeyP">P</button><button class="key" data-code="BracketLeft">´</button><button class="key" data-code="BracketRight">+</button><button class="key key-enter" data-code="Enter">Enter</button>
                </div>
                <div class="keyboard-row">
                    <button class="key key-caps" data-code="CapsLock">Bloq Mayús</button><button class="key" data-code="KeyA">A</button><button class="key" data-code="KeyS">S</button><button class="key" data-code="KeyD">D</button><button class="key" data-code="KeyF">F</button><button class="key" data-code="KeyG">G</button><button class="key" data-code="KeyH">H</button><button class="key" data-code="KeyJ">J</button><button class="key" data-code="KeyK">K</button><button class="key" data-code="KeyL">L</button><button class="key" data-code="Semicolon">Ñ</button><button class="key" data-code="Quote">¨</button><button class="key key-enter" data-code="Backslash">Ç</button>
                </div>
                <div class="keyboard-row">
                    <button class="key key-shift" data-code="ShiftLeft">Mayús</button><button class="key" data-code="IntlBackslash">&lt;</button><button class="key" data-code="KeyZ">Z</button><button class="key" data-code="KeyX">X</button><button class="key" data-code="KeyC">C</button><button class="key" data-code="KeyV">V</button><button class="key" data-code="KeyB">B</button><button class="key" data-code="KeyN">N</button><button class="key" data-code="KeyM">M</button><button class="key" data-code="Comma">,</button><button class="key" data-code="Period">.</button><button class="key" data-code="Slash">-</button><button class="key key-shift" data-code="ShiftRight">Mayús</button>
                </div>
                <div class="keyboard-row keyboard-row-bottom">
                    <button class="key key-modifier" data-code="ControlLeft">Ctrl</button><button class="key key-modifier" data-code="MetaLeft">Win</button><button class="key key-modifier" data-code="AltLeft">Alt</button><button class="key key-space" data-code="Space">Espacio</button><button class="key key-modifier" data-code="AltRight">Alt Gr</button><button class="key key-modifier" data-code="MetaRight">Win</button><button class="key key-modifier" data-code="ContextMenu">Menú</button><button class="key key-modifier" data-code="ControlRight">Ctrl</button>
                </div>
            </div>
            <p class="status" id="status" role="status">Pulsa una tecla para comenzar</p>
        </section>
    </main>
    <script src="{% static 'app/js/keyboard.js' %}"></script>
</body>
</html>
